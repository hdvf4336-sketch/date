<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* ==========================================================
   Kalender – style-pro.css
   Developed from the original: same palette (navy #2c3e50,
   blue #3498db, red #e74c3c), but no fixed pixel offsets.
   ========================================================== */

/* ---------- Tokens ---------- */
:root {
  --bg:        #f4f6f9;
  --surface:   #ffffff;
  --ink:       #1f2d3a;
  --head:      #2c3e50;
  --head-ink:  #ffffff;
  --line:      #dde3ea;
  --cell:      #f3f6f8;
  --cell-hover:#3498db;
  --weekend:   #e9eef3;
  --today:     #e74c3c;
  --nav-hover: #e8f3ff;
  --nav-ink:   #2f9bff;
  --radius:    12px;
  --shadow:    0 4px 14px rgba(0, 0, 0, .08);
  --ease:      .2s ease;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg:        #11181f;
    --surface:   #18222c;
    --ink:       #e6edf3;
    --head:      #243546;
    --line:      #2b3a48;
    --cell:      #1e2b37;
    --weekend:   #223140;
    --nav-hover: #1c3550;
  }
}

/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  padding: clamp(12px, 3vw, 32px);
  font-family: "Segoe UI", system-ui, Arial, sans-serif;
  background-color: var(--bg);
  color: var(--ink);

  /* [prev] [month / year] [next] – replaces left:550px; bottom:50px */
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 12px;
  max-width: 62rem;
  margin-inline: auto;
}

/* ---------- Navigation ---------- */
#addm, #bu {
  grid-row: 1;
  display: grid;
  place-items: center;
  width: 46px;
  height: 46px;
  padding: 0;
  border: none;
  border-radius: 50%;
  background: none;
  color: var(--ink);
  font-size: 28px;
  line-height: 1;
  cursor: pointer;
  transition: background var(--ease), color var(--ease), transform .15s ease;
}

#addm { grid-column: 1; }
#bu   { grid-column: 3; }

#addm:hover, #bu:hover  { background: var(--nav-hover); color: var(--nav-ink); }
#addm:active, #bu:active { transform: scale(.9); }

/* ---------- Month / year ---------- */
.div {
  grid-row: 1;
  grid-column: 2;
  display: flex;
  justify-content: center;
  align-items: baseline;
  gap: .4ch;
  direction: ltr;
}

.div h1 {
  margin: 0;
  font-size: clamp(1.4rem, 4.5vw, 2.2rem);
  font-weight: 700;
  letter-spacing: -.01em;
  font-variant-numeric: tabular-nums;
}

.div h1:nth-child(2) { font-weight: 300; opacity: .5; }

/* ---------- Table ---------- */
table {
  grid-column: 1 / -1;
  width: 100%;
  table-layout: fixed;
  border-collapse: separate;
  border-spacing: 0;
  background-color: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow);
}

th, td {
  padding: 0;
  border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  text-align: center;
}

th:last-child, td:last-child { border-right: 0; }
tbody tr:last-child > *      { border-bottom: 0; }

/* Header row */
thead th {
  padding: 12px 4px;
  background-color: var(--head);
  color: var(--head-ink);
  font-size: clamp(.6rem, 2.1vw, .95rem);
  font-weight: 600;
  border-color: rgba(255, 255, 255, .12);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* ---------- Day cells ---------- */
tbody th, tbody td {
  height: clamp(44px, 9vw, 72px);
  background-color: var(--cell);
  font-weight: 500;
}

/* Weekend columns: Sonntag (1st) and Samstag (7th) */
tbody > tr > :nth-child(7n+1),
tbody > tr > :nth-child(7n) {
  background-color: var(--weekend);
}

/* Day buttons fill the whole cell */
input[type="button"],
tbody button {
  display: block;
  width: 100%;
  height: 100%;
  min-height: inherit;
  padding: 0;
  border: none;
  border-radius: 0;
  background: transparent;
  color: inherit;
  font: inherit;
  font-size: clamp(.85rem, 2.8vw, 1.1rem);
  font-variant-numeric: tabular-nums;
  cursor: pointer;
  transition: background-color var(--ease), color var(--ease), transform .15s ease;
}

input[type="button"]:hover,
tbody button:hover {
  background-color: var(--cell-hover);
  color: #fff;
}

input[type="button"]:active,
tbody button:active { transform: scale(.94); }

/* Empty / disabled cells */
input[type="button"][value=""],
input[type="button"]:disabled,
tbody button:empty,
tbody button:disabled {
  cursor: default;
  pointer-events: none;
  opacity: .4;
}

/* ---------- Today (.today and .tode both work) ---------- */
.today, .tode {
  background-color: var(--today) !important;
  color: #fff !important;
  font-weight: 700;
  box-shadow: inset 0 0 0 3px var(--surface);
}

/* Inherits the red when the class is on the cell, not on the button */
.today > input[type="button"], .tode > input[type="button"],
.today > button,               .tode > button {
  background: transparent;
  color: inherit;
}

/* ---------- Focus & note ---------- */
:is(#addm, #bu, input[type="button"], tbody button):focus-visible {
  outline: 3px solid var(--nav-ink);
  outline-offset: -3px;
}

#p1 {
  grid-column: 1 / -1;
  margin: 0;
  text-align: center;
  opacity: .75;
}

/* ---------- Small screens ---------- */
@media (max-width: 30rem) {
  body { padding: 10px; gap: 8px; }
  thead th { padding-inline: 0; font-size: .58rem; letter-spacing: -.02em; }
}

/* ---------- Motion & print ---------- */
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}

@media print {
  body { background: #fff; padding: 0; }
  #addm, #bu { display: none; }
  table { box-shadow: none; }
}
       
    </style>
</head>
<body>
    <button id="addm"><</button>
    <button id="bu" >></button>
    <div class="div">
        <h1 id="hm"></h1>
        <h1>/</h1>
        <h1 id="ha"></h1>
    </div>
    <table >
        <thead>
            <tr>
                <th>Sonntag</th>
                <th>Montag</th>
                <th>Dienstag</th>
                <th>Mittwoch</th>
                <th>Donnerstag</th>
                <th>Freitag</th>
                <th>Samstag</th>
            </tr>
        </thead>
        <tbody id="tab">

        </tbody>
    </table>
    <p style="text-align: center;" id="p1"></p>
</body>
<script>
    data=[
  { "order": 1,  "month": "January",   "days": 31 },
  { "order": 2,  "month": "February",  "days": 28 },
  { "order": 3,  "month": "March",     "days": 31 },
  { "order": 4,  "month": "April",     "days": 30 },
  { "order": 5,  "month": "May",       "days": 31 },
  { "order": 6,  "month": "June",      "days": 30 },
  { "order": 7,  "month": "July",      "days": 31 },
  { "order": 8,  "month": "August",    "days": 31 },
  { "order": 9,  "month": "September", "days": 30 },
  { "order": 10, "month": "October",   "days": 31 },
  { "order": 11, "month": "November",  "days": 30 },
  { "order": 12, "month": "December",  "days": 31 }
]
document.body.onload=function(){
    date=new Date()
    a=date.getFullYear()
    document.getElementById('ha').innerText=a
    m=date.getMonth()
    document.getElementById('hm').innerText=m +1
    jour=date.getDate()
    d=new Date(a,m,1)
   idex=d.getDay()
   console.log(idex)
   for(elt of data){
        if(elt.order==m+1){
            day=elt.days
        }
   }
   tr=document.createElement('tr')
   c=1
   for(i=0;i<7;i++){
     if(i<idex){
        td=document.createElement('th')
        document.getElementById('tab').appendChild(td)
        
     }
     else{
        
        td=document.createElement('th')
        td.innerHTML=`<input type="button" value="${c}"  onmouseover="mouseover(this)" onmouseout="mouseout(this)" > `
        document.getElementById('tab').appendChild(td)
        if(i==jour){
            td.classList.add('today')
        }
        c++
     }
   }


   for(i=c;i<=day;i+=7){
        tr=document.createElement('tr')
        for(x=i;x<7+i;x++){
            if(x<=day){
                td=document.createElement('th')
                td.innerHTML=`<input type="button" value="${x}" onmouseover="mouseover(this)" onmouseout="mouseout(this)">`
                tr.appendChild(td)
                if(x==jour){
                    td.classList.add('today')
                }
            }
            
            
        }
        document.getElementById('tab').appendChild(tr)
   }




}
function mouseover(comp){
    a=parseInt(comp.value)
    date=new Date()
    ans=parseInt(document.getElementById('ha').innerText)
    monthe=parseInt(document.getElementById('hm').innerText)
    jour=new Date(ans ,monthe-1,a)
    console.log(jour)
    day=Math.floor((date-jour)/(1000*60*60*24))
   
    if(day>0){
        document.getElementById('p1').innerText=`BEFORE ${day} day`
    }
    else if(day==0){
        document.getElementById('p1').innerText=`TODAY`
    }
    else{
        e=Math.abs(day)
        document.getElementById('p1').innerText=`AFTER  ${e} day`
    }

    
}
function mouseout(comp){
    document.getElementById('p1').innerText=``
}

document.getElementById('addm').onclick=function(){
    document.getElementById('tab').innerHTML=''
    a=document.getElementById('ha').innerText
    m=document.getElementById('hm').innerText
    if(m==12){
        document.getElementById('hm').innerText=1
        m=0
        a=parseInt(a)+1
        document.getElementById('ha').innerText=a
        
    }
    else{
        document.getElementById('hm').innerText=parseInt(m)+1
    }
    d=new Date(a,m,1)
   idex=d.getDay()
   
   for(elt of data){
        
        if(elt.order==parseInt(m)+1){
            day=elt.days
            if(day==28){
                if(parseInt(a)%4==0){
                    day=29
                }
                else{
                    day=28
                }
            }
        }
   }
   console.log(day)
   tr=document.createElement('tr')
   c=1
   for(i=0;i<7;i++){
     if(i<idex){
        td=document.createElement('th')
        document.getElementById('tab').appendChild(td)
        
     }
     else{
        
        td=document.createElement('th')
        td.innerHTML=`<input type="button" value="${c}"  onmouseover="mouseover(this)" onmouseout="mouseout(this)" > `
        document.getElementById('tab').appendChild(td)
        if(i==jour){
            td.classList.add('today')
        }
        c++
     }
   }


   for(i=c;i<=day;i+=7){
        tr=document.createElement('tr')
        for(x=i;x<7+i;x++){
            if(x<=day){
                td=document.createElement('th')
                td.innerHTML=`<input type="button" value="${x}" onmouseover="mouseover(this)" onmouseout="mouseout(this)">`
                tr.appendChild(td)
                if(x==jour){
                    td.classList.add('today')
                }
            }
            
            
        }
        document.getElementById('tab').appendChild(tr)
   }

}


   




document.getElementById('bu').onclick=function(){
    document.getElementById('tab').innerHTML=''
    a=document.getElementById('ha').innerText
    m=document.getElementById('hm').innerText
    if(m==1){
        document.getElementById('hm').innerText=12
        m=13
        a=parseInt(a)-1
        document.getElementById('ha').innerText=a    
    }
    else{
        document.getElementById('hm').innerText=parseInt(m)-1
    }
    d=new Date(a,m-2,1)
    console.log(d)
   
   idex=d.getDay()
   
   for(elt of data){
        
        if(elt.order==parseInt(m)+1){
            day=elt.days
            if(day==28){
                if(parseInt(a)%4==0){
                    day=29
                }
                else{
                    day=28
                }
            }
        }
   }
   console.log(day)
   tr=document.createElement('tr')
   c=1
   for(i=0;i<7;i++){
     if(i<idex){
        td=document.createElement('th')
        document.getElementById('tab').appendChild(td)
        
     }
     else{
        
        td=document.createElement('th')
        td.innerHTML=`<input type="button" value="${c}"  onmouseover="mouseover(this)" onmouseout="mouseout(this)" > `
        document.getElementById('tab').appendChild(td)
        if(i==jour){
            td.classList.add('today')
        }
        c++
     }
   }


   for(i=c;i<=day;i+=7){
        tr=document.createElement('tr')
        for(x=i;x<7+i;x++){
            if(x<=day){
                td=document.createElement('th')
                td.innerHTML=`<input type="button" value="${x}" onmouseover="mouseover(this)" onmouseout="mouseout(this)">`
                tr.appendChild(td)
                if(x==jour){
                    td.classList.add('today')
                }
            }
            
            
        }
        document.getElementById('tab').appendChild(tr)
   }

}

    

</script>
</html>
