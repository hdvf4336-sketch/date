<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table{
            width: 100%;
        }
        body{
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
        }

        table{
            width: 100%;
            border-collapse: collapse;
            background-color: #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        th{
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }

        
        tr:first-child th{
            background-color: #2c3e50;
            color: white;
            font-weight: bold;
        }

      
        input[type="button"]{
            width: 100%;
            padding: 15px 0;
            border: none;
            background-color: #ecf0f1;
            cursor: pointer;
            font-size: 16px;
            transition: 0.2s;
        }

        
        input[type="button"]:hover{
            background-color: #3498db;
            color: white;
        }

        .today{
            background-color: #e74c3c !important;
            color: white;
        }
        .div{
            display: flex;
            position: relative;
            left: 550px;
            bottom: 50px;
        }
        #addm, #bu {
            background: none;
            border: none;
            font-size: 30px;
            color: #000;
            width: 45px;
            height: 45px;
            cursor: pointer;
            border-radius: 50%;
            transition: 0.2s;
            text-align: center;
        }
        #addm:hover, #bu:hover {
            background: #e8f3ff;
            color: #2f9bff;
        }
       
    </style>
</head>
<body>
    <button id="addm"><</button>
    <button id="bu" >></button>
    <div class="div">
        <h1 id="hm"></h1>
        <h1>/</h1>
        <h1 id="ha"></h1>
    </div>
    <table >
        <thead>
            <tr>
                <th>Sonntag</th>
                <th>Montag</th>
                <th>Dienstag</th>
                <th>Mittwoch</th>
                <th>Donnerstag</th>
                <th>Freitag</th>
                <th>Samstag</th>
            </tr>
        </thead>
        <tbody id="tab">

        </tbody>
    </table>
    <p style="text-align: center;" id="p1"></p>
</body>
<script>
    data=[
  { "order": 1,  "month": "January",   "days": 31 },
  { "order": 2,  "month": "February",  "days": 28 },
  { "order": 3,  "month": "March",     "days": 31 },
  { "order": 4,  "month": "April",     "days": 30 },
  { "order": 5,  "month": "May",       "days": 31 },
  { "order": 6,  "month": "June",      "days": 30 },
  { "order": 7,  "month": "July",      "days": 31 },
  { "order": 8,  "month": "August",    "days": 31 },
  { "order": 9,  "month": "September", "days": 30 },
  { "order": 10, "month": "October",   "days": 31 },
  { "order": 11, "month": "November",  "days": 30 },
  { "order": 12, "month": "December",  "days": 31 }
]
document.body.onload=function(){
    date=new Date()
    a=date.getFullYear()
    document.getElementById('ha').innerText=a
    m=date.getMonth()
    document.getElementById('hm').innerText=m +1
    jour=date.getDate()
    d=new Date(a,m,1)
   idex=d.getDay()
   console.log(idex)
   for(elt of data){
        if(elt.order==m+1){
            day=elt.days
        }
   }
   tr=document.createElement('tr')
   c=1
   for(i=0;i<7;i++){
     if(i<idex){
        td=document.createElement('th')
        document.getElementById('tab').appendChild(td)
        
     }
     else{
        
        td=document.createElement('th')
        td.innerHTML=`<input type="button" value="${c}"  onmouseover="mouseover(this)" onmouseout="mouseout(this)" > `
        document.getElementById('tab').appendChild(td)
        if(i==jour){
            td.classList.add('today')
        }
        c++
     }
   }


   for(i=c;i<=day;i+=7){
        tr=document.createElement('tr')
        for(x=i;x<7+i;x++){
            if(x<=day){
                td=document.createElement('th')
                td.innerHTML=`<input type="button" value="${x}" onmouseover="mouseover(this)" onmouseout="mouseout(this)">`
                tr.appendChild(td)
                if(x==jour){
                    td.classList.add('today')
                }
            }
            
            
        }
        document.getElementById('tab').appendChild(tr)
   }




}
function mouseover(comp){
    a=parseInt(comp.value)
    date=new Date()
    ans=parseInt(document.getElementById('ha').innerText)
    monthe=parseInt(document.getElementById('hm').innerText)
    jour=new Date(ans ,monthe-1,a)
    console.log(jour)
    day=Math.floor((date-jour)/(1000*60*60*24))
   
    if(day>0){
        document.getElementById('p1').innerText=`AFTER ${day} day`
    }
    else if(day==0){
        document.getElementById('p1').innerText=`TODAY`
    }
    else{
        e=Math.abs(day)
        document.getElementById('p1').innerText=`BEFORE ${e} day`
    }

    
}
function mouseout(comp){
    document.getElementById('p1').innerText=``
}

document.getElementById('addm').onclick=function(){
    document.getElementById('tab').innerHTML=''
    a=document.getElementById('ha').innerText
    m=document.getElementById('hm').innerText
    if(m==12){
        document.getElementById('hm').innerText=1
        m=0
        a=parseInt(a)+1
        document.getElementById('ha').innerText=a
        
    }
    else{
        document.getElementById('hm').innerText=parseInt(m)+1
    }
    d=new Date(a,m,1)
   idex=d.getDay()
   
   for(elt of data){
        
        if(elt.order==parseInt(m)+1){
            day=elt.days
            if(day==28){
                if(parseInt(a)%4==0){
                    day=29
                }
                else{
                    day=28
                }
            }
        }
   }
   console.log(day)
   tr=document.createElement('tr')
   c=1
   for(i=0;i<7;i++){
     if(i<idex){
        td=document.createElement('th')
        document.getElementById('tab').appendChild(td)
        
     }
     else{
        
        td=document.createElement('th')
        td.innerHTML=`<input type="button" value="${c}"  onmouseover="mouseover(this)" onmouseout="mouseout(this)" > `
        document.getElementById('tab').appendChild(td)
        if(i==jour){
            td.classList.add('today')
        }
        c++
     }
   }


   for(i=c;i<=day;i+=7){
        tr=document.createElement('tr')
        for(x=i;x<7+i;x++){
            if(x<=day){
                td=document.createElement('th')
                td.innerHTML=`<input type="button" value="${x}" onmouseover="mouseover(this)" onmouseout="mouseout(this)">`
                tr.appendChild(td)
                if(x==jour){
                    td.classList.add('today')
                }
            }
            
            
        }
        document.getElementById('tab').appendChild(tr)
   }

}


   




document.getElementById('bu').onclick=function(){
    document.getElementById('tab').innerHTML=''
    a=document.getElementById('ha').innerText
    m=document.getElementById('hm').innerText
    if(m==1){
        document.getElementById('hm').innerText=12
        m=13
        a=parseInt(a)-1
        document.getElementById('ha').innerText=a    
    }
    else{
        document.getElementById('hm').innerText=parseInt(m)-1
    }
    d=new Date(a,m-2,1)
    console.log(d)
   
   idex=d.getDay()
   
   for(elt of data){
        
        if(elt.order==parseInt(m)+1){
            day=elt.days
            if(day==28){
                if(parseInt(a)%4==0){
                    day=29
                }
                else{
                    day=28
                }
            }
        }
   }
   console.log(day)
   tr=document.createElement('tr')
   c=1
   for(i=0;i<7;i++){
     if(i<idex){
        td=document.createElement('th')
        document.getElementById('tab').appendChild(td)
        
     }
     else{
        
        td=document.createElement('th')
        td.innerHTML=`<input type="button" value="${c}"  onmouseover="mouseover(this)" onmouseout="mouseout(this)" > `
        document.getElementById('tab').appendChild(td)
        if(i==jour){
            td.classList.add('today')
        }
        c++
     }
   }


   for(i=c;i<=day;i+=7){
        tr=document.createElement('tr')
        for(x=i;x<7+i;x++){
            if(x<=day){
                td=document.createElement('th')
                td.innerHTML=`<input type="button" value="${x}" onmouseover="mouseover(this)" onmouseout="mouseout(this)">`
                tr.appendChild(td)
                if(x==jour){
                    td.classList.add('today')
                }
            }
            
            
        }
        document.getElementById('tab').appendChild(tr)
   }

}

    

</script>
</html>
